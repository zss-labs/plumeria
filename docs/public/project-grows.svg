    <text class="tree" x="288" y="64">components/</text>
    <text class="tree" x="288" y="86">├─ Card.tsx</text>
    <text class="tree" x="288" y="108">└─ Notice.tsx</text>
    <text class="tree hl" x="288" y="130">styles/</text>
