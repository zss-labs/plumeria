  <text class="code dim" x="444" y="95">create_hash</text>
  <text class="code" x="570" y="95">…/button.ts-btn → <tspan class="id">x2vyv31m</tspan></text>
  <text class="code dim" x="444" y="132">create_obj</text>
  <text class="code" x="570" y="132"><tspan class="id">x2vyv31m</tspan> → { base: { padding: 16 } }</text>

  <text class="title" x="34" y="203">Card.tsx</text>
