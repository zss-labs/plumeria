  </g>

  <g filter="url(#ink)">
  <text class="title" x="34" y="52">button.ts</text>
  <text class="code" x="34" y="90"><tspan class="dim">export const</tspan> btn = css.create({</text>
  <text class="code" x="54" y="117">base: { padding: 16 },</text>
  <text class="code" x="34" y="144">});</text>
  <text class="note" x="349" y="85">scan</text>

