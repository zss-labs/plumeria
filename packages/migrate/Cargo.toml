[package]
name = "plumeria-migrate"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "plumeria-migrate"
path = "src/main.rs"

[dependencies]
cssparser = "0.37.0"
oxc_allocator = "0.158.0"
oxc_ast = "0.158.0"
oxc_ast_visit = "0.158.0"
oxc_parser = "0.158.0"
oxc_semantic = "0.158.0"
oxc_span = "0.158.0"
rustc-hash = "2"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "z"
strip = "symbols"
